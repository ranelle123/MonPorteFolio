<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - Projet M2L</title>
    <style>
        /* ==========================================================================
           1. Réinitialisation et Variables
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f8fafc;
            --text-color: #334155;
            --primary-color: #2563eb; /* Bleu professionnel */
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ==========================================================================
           2. Structure Principale
           ========================================================================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        h1 {
            font-size: 2.25rem;
            color: #0f172a;
            margin-bottom: 2.5rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        /* Petite barre bleue sous le titre pour le style */
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        /* ==========================================================================
           3. Galerie de Documentation (Images)
           ========================================================================== */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .image-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            border: 1px solid #f1f5f9;
        }

        .caption {
            margin-top: 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #64748b;
            text-align: center;
            text-transform: capitalize; /* Optionnel : met une majuscule au début */
        }

        /* ==========================================================================
           4. Pied de page (Footer)
           ========================================================================== */
        footer {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 2rem 1.5rem;
            margin-top: auto; /* Force le footer à rester en bas */
            font-size: 0.9rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Remise en place du titre de ton projet -->
        <h1>PROJET ET MISSIONS EN ENTREPRISE</h1>
        
        <!-- Toutes les images doivent impérativement rester dans ce conteneur global -->
        <div class="image-gallery">
            
            <!-- 1. Présentation -->
            <div class="image-card">
                <img src="images/présentation.png" alt="Schéma de l'entreprise M2L">
                <p class="caption">Présentation de l'entreprise</p>
            </div>
            
            <!-- 2. Solutions Informatiques -->
            <div class="image-card">
                <img src="images/SolutionsInformatique.png" alt="Solutions informatiques M2L">
                <p class="caption">Solutions informatiques</p>
            </div>

            <!-- 3. Présentation du logiciel -->
            <div class="image-card">
                <img src="images/présenationLogiciel.png" alt="Présentation du logiciel">
                <p class="caption">Présentation du logiciel</p>
            </div>

            <!-- 4. Hiérarchie -->
            <div class="image-card">
                <img src="images/hierarchie.png" alt="Organigramme de la hiérarchie en entreprise">
                <p class="caption">Hiérarchie en entreprise</p>
            </div>

        </div> <!-- Fin de la galerie (Fermée une seule fois à la toute fin) -->
    </main>

    <footer>
        
            <a href="index.html" class="back-link">Retour au portfolio</a>
        </p>
    </footer>

</body>
</html>
